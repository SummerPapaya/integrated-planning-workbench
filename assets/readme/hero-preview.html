<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IPW · README Hero Preview</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:36px 24px 64px;background:#e6e4de;color:#282e28;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}main{max-width:980px;margin:auto}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}h1{font-size:27px;letter-spacing:-.04em;margin:0}header p{margin:4px 0 0;color:#6c7268;font-size:13px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}button,a.control{font:inherit;font-size:13px;background:#f8f6ef;color:#454d43;border:1px solid #c7c9bd;padding:7px 13px;text-decoration:none;cursor:pointer}button.active{background:#30372f;color:#f6f2e9;border-color:#30372f}figure{margin:0 auto 27px;max-width:900px;transition:max-width .2s}figure.narrow{max-width:360px}figure img{display:block;width:100%;height:auto}figcaption{font-size:12px;color:#686e64;margin-top:11px}.credit{margin:28px auto 0;max-width:900px;border-top:1px solid #c9cbbf;padding-top:23px}.credit img{display:block;width:320px;max-width:100%}.credit p{font-size:12px;color:#6c7268;margin-bottom:13px}.note{max-width:900px;margin:0 auto;color:#666f62;font-size:13px}.note a{color:#8f5234}body.dark{background:#0d1117;color:#e1e5dc}body.dark header p,body.dark figcaption,body.dark .note,body.dark .credit p{color:#a5ad9d}body.dark .credit{border-color:#343b33}@media(max-width:600px){body{padding:24px 12px}header{display:block}header p{margin-top:9px}h1{font-size:23px}.controls{margin-top:17px}}
  </style>
</head>
<body><main>
  <header><div><h1>Integrated Planning Workbench</h1><p>中英双语 animated SVG · 9 秒工作流循环</p></div><p>README HERO / ASSET PREVIEW</p></header>
  <div class="controls"><button type="button" class="active" id="motion">动画版</button><button type="button" id="still">静态版</button><button type="button" id="width">切换 360px 预览</button><button type="button" id="theme">切换背景</button><a class="control" href="hero-bilingual.svg">打开原始 SVG ↗</a></div>
  <figure id="frame"><img id="hero" src="hero-bilingual.svg" alt="Integrated Planning Workbench｜计划与品类决策：比较预测、推演 PSI、复核品类行动。曲线与矩阵为流程示意。"><figcaption>900px README 内容宽度。标题保持可读；动画依次展示预测、库存情景与人工复核，再留出静止阅读时间。系统启用“减少动态效果”时自动停止动画。</figcaption></figure>
  <p class="note">所有曲线与矩阵均为流程示意，不代表实际销量、模型精度或服务水平。另附 <a href="hero-bilingual-static.svg">静态 SVG</a>，供不播放 SVG 动画的查看器使用。</p>
  <div class="credit"><p>CREDITS · README 视觉设计使用 beautify-github-readme</p><a href="https://github.com/oil-oil/beautify-github-readme"><img src="made-with-beautify.svg" alt="README made with beautify-github-readme"></a></div>
</main>
<script>
  const hero=document.querySelector('#hero'),motion=document.querySelector('#motion'),still=document.querySelector('#still');
  motion.onclick=()=>{hero.src='hero-bilingual.svg';motion.classList.add('active');still.classList.remove('active')};
  still.onclick=()=>{hero.src='hero-bilingual-static.svg';still.classList.add('active');motion.classList.remove('active')};
  document.querySelector('#width').onclick=()=>{document.querySelector('#frame').classList.toggle('narrow')};
  document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('dark')};
</script></body></html>
