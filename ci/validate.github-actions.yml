name: Validate workbench
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node scripts/check_planning_console.mjs
      - run: python3 scripts/check_planning_workbench.py
      - run: python3 scripts/check_static_links.py
      - run: python3 scripts/check_public_repo.py
